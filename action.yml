name: 'clj-holmes (Clojure)'
author: 'clj-holmes'
description: 'Executes clj-holmes security scan in clojure/clojurescript projects.'
inputs:
  rules-repository:
    description: 'repository containing all the rules'
    required: false
    default: 'git://clj-holmes/clj-holmes-rules#main'
  output-type:
    description: 'Output type'
    required: false
    default: 'sarif'
  output-file:
    description: 'Output file'
    required: false
    default: 'clj_holmes_scan_results.txt'
  fail-on-result:
    description: 'Enable or disable fail if results were found'
    required: false
    default: 'false'
  verbose:
    description: 'Enable or disable printing the progress bar'
    required: false
    default: 'false'
  path:
    description: 'Directory to run clj-holmes on'
    required: false
  ignored-paths:
    description: 'Comma-separated list of path regexes to exclude from scanning (e.g., `\.cljs$,^test/`)'
    required: false
  rule-tags:
    description: 'Comma-separated list of rule tags to include (e.g., `security,vulnerability,ssl,correctness`)'
    required: false
  rule-severities:
    description: 'Comma-separated list of rule severities to include (e.g., `error,warning,info`)'
    required: false
  rule-precisions:
    description: 'Comma-separated list of rule precisions to include (e.g., `low,medium,high,very-high`)'
    required: false

runs:
  using: 'docker'
  image: 'Dockerfile'
  args:
    - ${{ inputs.rules-repository }}
    - ${{ inputs.output-type }}
    - ${{ inputs.output-file }}
    - ${{ inputs.fail-on-result }}
    - ${{ inputs.verbose }}
    - ${{ inputs.path }}
    - ${{ inputs.ignored-paths }}
    - ${{ inputs.rule-tags }}
    - ${{ inputs.rule-severities }}
    - ${{ inputs.rule-precisions }}

branding:
 color: gray-dark
 icon: shield
